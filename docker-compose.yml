# Docker Compose для проекта «Витрина интернет-магазина» (Спринт 8)
#
# Поднимает все сервисы стенда:
#   market-app       — витрина (http://localhost:8080)
#   payments-service — RESTful-сервис платежей (http://localhost:8081)
#   keycloak         — Authorization Server OAuth2 (http://localhost:8082)
#   redis            — кеш карточек и страниц каталога
#   market-postgres  — персистентная БД PostgreSQL
#   market-s3mock    — S3-совместимое хранилище картинок
#   s3mock-seed      — однократная заливка картинок витрины в хранилище
#
# Запуск всего стека:
#   docker compose up -d --build

services:
  market-app:
    build:
      context: .
      dockerfile: market-app/Dockerfile
    container_name: my-market-app
    restart: unless-stopped
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://market-postgres:5432/market
      SPRING_R2DBC_USERNAME: market
      SPRING_R2DBC_PASSWORD: market
      SPRING_DATASOURCE_URL: jdbc:postgresql://market-postgres:5432/market
      SPRING_DATASOURCE_USERNAME: market
      SPRING_DATASOURCE_PASSWORD: market
      MARKET_IMAGE_S3_ENDPOINT: http://market-s3mock:9090
      MARKET_IMAGE_S3_BUCKET: market-images
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MARKET_PAYMENTS_BASE_URL: http://payments-service:8081
      MARKET_CACHE_ITEMS_TTL: PT5M
      # Спринт 8 — OAuth2 Client Credentials для вызовов payments-service.
      MARKET_OAUTH2_CLIENT_ID: market-app
      MARKET_OAUTH2_CLIENT_SECRET: market-secret
      MARKET_OAUTH2_TOKEN_URI: http://keycloak:8080/realms/market/protocol/openid-connect/token
    ports:
      - "8080:8080"
    depends_on:
      market-postgres:
        condition: service_healthy
      market-s3mock:
        condition: service_healthy
      redis:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  payments-service:
    build:
      context: .
      dockerfile: payments-service/Dockerfile
    container_name: my-market-payments-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      PAYMENTS_INITIAL_BALANCE: 10000
      # Спринт 8 — OAuth2 Resource Server: валидация JWT от Keycloak.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/market
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/market/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    # Actuator healthcheck не зависит от бизнес-состояния баланса.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.2-bookworm
    container_name: my-market-redis
    restart: unless-stopped
    # Ключ версии каталога хранится без TTL, поэтому вытесняются только ключи с ограниченным сроком жизни.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  market-postgres:
    image: postgres:17.5
    container_name: my-market-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    ports:
      - "5439:5432"
    volumes:
      - market_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 5s
      timeout: 3s
      retries: 10

  market-s3mock:
    image: adobe/s3mock:5.2.3
    container_name: my-market-app-s3mock
    restart: unless-stopped
    user: "0:0"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: market-images
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
    ports:
      - "9090:9090"
    volumes:
      - market_s3mock_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/market-images || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  s3mock-seed:
    image: amazon/aws-cli:2.31.11
    container_name: my-market-app-s3mock-seed
    restart: "no"
    depends_on:
      market-s3mock:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: market
      AWS_SECRET_ACCESS_KEY: market
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/seed-images:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 30); do
          if wget -q -O /dev/null "http://market-s3mock:9090/market-images"; then break; fi
          sleep 1
        done
        for file in /seed/*; do
          aws --endpoint-url http://market-s3mock:9090 s3 cp "$$file" "s3://market-images/$$(basename $$file)"
        done
        echo "Картинки витрины загружены"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.1
    container_name: my-market-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev", "--import-realm"]
    ports:
      - "8082:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  keycloak-postgres:
    image: postgres:17.5
    container_name: my-market-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5436:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  market_postgres_data:
  market_s3mock_data:
  keycloak_postgres_data:
