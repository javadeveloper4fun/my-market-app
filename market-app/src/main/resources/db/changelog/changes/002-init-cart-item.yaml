# ===================================================================
# Создание таблицы корзины (Sprint 7 baseline).
#
# Изначально item_id был UNIQUE (одна корзина/один пользователь).
# В Sprint 8 добавлен user_id (011) и уникальность заменена на
# (item_id, user_id) миграцией 013-fix-cart-item-unique.yaml.
# Структура ниже сохранена как историческая baseline-миграция.
# ===================================================================

databaseChangeLog:

  - changeSet:
      id: "3"
      author: "student"
      comment: "Таблица позиций корзины"
      onFailMessage: "Таблица cart_item уже существует: база создана в обход Liquibase"
      preConditions:
        - not:
            - tableExists:
                tableName: cart_item
      changes:
        - createTable:
            tableName: cart_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart_item
                    nullable: false
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_cart_item_item
              - column:
                  name: count
                  type: INTEGER
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: cart_item
