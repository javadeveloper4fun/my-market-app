# ===================================================================
# Выравнивание последовательности идентификаторов таблицы items.
#
# При добавлении товаров приложением идентификатор выдаёт autoIncrement/
# последовательность БД. Если после сида или иных вставок счётчик
# последовательности оказывается не синхронизирован с MAX(id), следующая
# вставка может завершиться DuplicateKeyException по первичному ключу.
#
# Миграция подстраивает последовательность (PostgreSQL) или счётчик (H2)
# под фактический максимум идентификатора в таблице. Значение берётся из
# данных, поэтому изменение числа сид-строк не требует жёсткой константы.
#
# Уже применённые миграции не изменяются (это привело бы к ошибке проверки
# контрольной суммы Liquibase), поэтому корректировка вынесена отдельно.
# ===================================================================

databaseChangeLog:

  - changeSet:
      id: 1
      author: student
      dbms: postgresql
      comment: >
        Сдвигает последовательность items за максимальный идентификатор.
        Значение берётся из данных, а не задаётся константой: число
        товаров при начальном наполнении может измениться, и жёстко
        заданное значение разошлось бы с таблицей при следующем сиде.
      runOnChange: false
      changes:
        - sql:
            sql: SELECT setval('items_id_seq', COALESCE((SELECT MAX(id) FROM items), 1))
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 2
      author: student
      dbms: h2
      comment: >
        Перезапускает счётчик идентификаторов items за максимальным
        идентификатором. Обратное слово соответствует H2.
      runOnChange: false
      changes:
        - sql:
            sql: ALTER TABLE items ALTER COLUMN id RESTART WITH (SELECT COALESCE(MAX(id), 1) FROM items)
            splitStatements: true
            stripComments: true