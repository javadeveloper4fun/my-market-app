<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Вход — Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container p-2">
        <div class="row p-2">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">Вход в магазин</h2>
                        <p class="card-text text-muted">Войдите, чтобы работать с корзиной и заказами.</p>
                        <form method="post" action="/login">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label class="form-label">Логин</label>
                                <input type="text" class="form-control" name="username" required autofocus/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control" name="password" required/>
                            </div>
                            <div class="mb-3 form-text">
                                Демо-аккаунты: user1 / password, user2 / password
                            </div>
                            <button type="submit" class="btn btn-primary">Войти</button>
                            <a href="/items" class="btn btn-outline-secondary">На витрину без входа</a>
                        </form>
                        <div th:if="${param.error}" class="alert alert-danger mt-3">
                            Неверный логин или пароль.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
