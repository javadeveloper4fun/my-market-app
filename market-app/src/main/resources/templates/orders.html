<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <title>Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container p-2">
        <div class="row p-2">
            <div class="col">
                <div class="hstack gap-3">
                    <h2>
                        <span class="badge text-bg-success">Витрина магазина</span>
                    </h2>
                    <a href="/cart/items" class="btn btn-secondary bi bi-cart4 ms-auto"
                       th:if="${isAuthenticated}">Корзина</a>
                    <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> Главная</a>
                    <a href="/login" class="btn btn-outline-primary ms-auto"
                       th:unless="${isAuthenticated}">Войти</a>
                    <form method="post" action="/logout" class="d-inline no-ajax"
                          th:if="${isAuthenticated}">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-danger">Выйти</button>
                    </form>
                    <div th:unless="${isAuthenticated}" class="text-danger ms-auto">
                        Заказы доступны только после входа.
                    </div>
                </div>
            </div>
        </div>
        <div class="row p-2" th:each="order : ${orders}">
            <div class="col">
                <div class="card">
                    <div class="card-header">
                        <a th:text="${'Заказ №'+order.id()}" th:href="${'/orders/'+order.id()}"></a>
                        <span th:switch="${order.status()}" class="ms-2">
                            <span th:case="'PAID'" class="badge text-bg-success">Оплачен</span>
                            <span th:case="'AWAITING_PAYMENT'" class="badge text-bg-warning">Ожидает оплаты</span>
                            <span th:case="*" class="badge text-bg-secondary" th:text="${order.status()}"></span>
                        </span>
                    </div>
                    <ul class="list-group list-group-flush" th:each="item : ${order.items()}">
                        <li class="list-group-item" th:text="${item.title()+' ('+item.count()+' шт.) '+(item.price()*item.count())+' руб.'}"/>
                    </ul>
                    <div class="card-footer">
                        <b th:text="${'Сумма: '+order.totalSum()}+' руб.'"></b>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
