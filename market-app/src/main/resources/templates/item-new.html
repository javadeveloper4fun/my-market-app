<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <title>Добавление товара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container p-2">
        <div class="row p-2">
            <div class="col">
                <div class="hstack gap-3">
                    <h2>
                        <span class="badge text-bg-success">Добавление товара</span>
                    </h2>
                    <a href="/orders" class="btn btn-secondary ms-auto bi bi-file-earmark-text"
                       th:if="${isAuthenticated}"> Заказы</a>
                    <a href="/cart/items" class="btn btn-secondary bi bi-cart4"
                       th:if="${isAuthenticated}"> Корзина</a>
                    <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> На главную</a>
                    <a href="/login" class="btn btn-outline-primary"
                       th:unless="${isAuthenticated}">Войти</a>
                    <form method="post" action="/logout" class="d-inline no-ajax"
                          th:if="${isAuthenticated}">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-danger">Выйти</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Сообщение об ошибке показывается только когда сервер её вернул.
             Поле ошибки необязательное: обычным проходом по форме его нет,
             и обращение к нему в условии th:if считается отсутствующим. -->
        <div class="row p-2" th:if="${error}">
            <div class="col">
                <div class="alert alert-danger mb-0" role="alert" th:text="${error}"></div>
            </div>
        </div>

        <div class="row p-2">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <!-- enctype обязателен: без него браузер отправит форму
                             как обычные данные, и файл картинки не дойдёт. -->
                        <form id="new-item-form" th:action="@{/items/new}" method="post" enctype="multipart/form-data">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label class="form-label" for="title">Название</label>
                                <input class="form-control" type="text" id="title" name="title"
                                       th:value="${title}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="description">Описание</label>
                                <input class="form-control" type="text" id="description" name="description"
                                       th:value="${description}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="price">Цена, руб.</label>
                                <input class="form-control" type="number" id="price" name="price"
                                       min="1" step="1" th:value="${price}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="image">Картинка</label>
                                <input class="form-control" type="file" id="image" name="image"
                                       accept="image/jpeg,image/png,image/gif" required>
                                <div class="form-text">Допустимы изображения в форматах jpeg, png и gif, до 5 МБ.</div>
                            </div>
                            <button class="btn btn-outline-success" type="submit">Добавить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('new-item-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = e.currentTarget;
            const formData = new FormData(form);
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-XSRF-TOKEN': formData.get('_csrf')
                    }
                });
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }
                const html = await response.text();
                document.open();
                document.write(html);
                document.close();
            } catch (err) {
                form.submit();
            }
        });
    </script>
</body>

</html>
