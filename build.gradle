plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'ru.yandex.practicum'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // Спринт 6 — реактивный доступ к данным. R2DBC не блокирует: вместо
    // синхронного DataSource возвращается ConnectionFactory, а репозитории
    // отдают Flux и Mono. Замена JPA осознанна: Hibernate ORM блокирующий,
    // Hibernate Reactive закрывает не все нужные случаи.
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Драйверы нужны оба, и это не дублирование. Приложение ходит в БД
    // через R2DBC (r2dbc-postgresql), а Liquibase — через JDBC (postgresql):
    // миграции выполняются до старта приложения и в реактивный поток
    // не вписываются. Убрав один из драйверов, получим либо отказ
    // соединения на старте, либо неоткаченные миграции.
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Спринт 5, Тема 4 — миграции схемы БД.
    // Нужны две зависимости, и это не дублирование:
    // liquibase-core — сам Liquibase (разбор changelog, выполнение changeset'ов),
    // версию подставляет spring-boot-dependencies из dependencyManagement ниже.
    // spring-boot-liquibase — автоконфигурация Spring Boot. В Spring Boot 4
    // автоконфигурация разнесена по отдельным модулям, и LiquibaseAutoConfiguration
    // лежит именно в spring-boot-liquibase. Без него одного liquibase-core
    // недостаточно: бин liquibase просто не создастся, миграции не выполнятся.
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-liquibase'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Тесты на H2 идут через R2DBC, поэтому нужен r2dbc-h2. Драйвер h2
    // остаётся тоже: через JDBC к нему подключается Liquibase.
    testRuntimeOnly 'io.r2dbc:r2dbc-h2'
    testRuntimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'

    // Спринт 5, Тема 5, Урок 2 — проверка схемы и запросов на настоящей СУБД.
    // H2 в MODE=PostgreSQL отличается от PostgreSQL, поэтому для части тестов
    // поднимается реальный сервер в контейнере.
    // spring-boot-testcontainers — аннотация @ServiceConnection: она берёт url,
    // имя пользователя и пароль из контейнера и подставляет их в DataSource,
    // поэтому @DynamicPropertySource писать не нужно.
    // testcontainers-postgresql — контейнер с PostgreSQL,
    // testcontainers-junit-jupiter — интеграция контейнеров с JUnit.
    // Имена модулей с префиксом testcontainers- относятся к Testcontainers 2.x;
    // в 1.x модули назывались postgresql и junit-jupiter. Версию всех задаёт
    // testcontainers-bom, подключённый через spring-boot-dependencies.
    //
    // Отдельного testcontainers-r2dbc здесь нет: версия 2.0.5 не публикуется, и
    // объявляющий R2DBCDatabaseContainer интерфейс из него недоступен.
    // Поэтому в PostgreSqlTestContainerConfiguration фабрика соединений R2DBC
    // собирается из контейнера вручную — причина описана там же.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat('2.98.0')
        removeUnusedImports()
    }
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = false
}