# ===================================================================
# Спринт 6, Тема 11 «Проектная работа» — выравнивание последовательности
# идентификаторов после начального наполнения витрины. И сид-данные, и
# форма добавления товара — следствие требования задания о загрузке
# списка товаров на витрину.
#
# Миграция 006 вставляет товары с явно заданными идентификаторами
# и тем самым оставляет последовательность позади: следующий вызов
# nextval возвращает 1, и первая же вставка, сделанная приложением,
# падает с DuplicateKeyException по первичному ключу.
#
# Пока товары создавались только сидом, этого не было видно: писала
# миграция, а она задавала идентификатор сама. С появлением формы
# добавления товара проблема проявилась на первой же отправке формы.
#
# Уже применённую миграцию 006 править нельзя: изменение меняет её
# MD5SUM, и Liquibase откажется стартовать с ошибкой Validation Failed.
# Поэтому здесь новая миграция, которая двигает последовательность за
# последний существующий идентификатор.
# ===================================================================

databaseChangeLog:

  - changeSet:
      id: 1
      author: student
      dbms: postgresql
      comment: >
        Сдвигает последовательность items за максимальный идентификатор.
        Значение берётся из данных, а не задаётся константой: число
        товаров при начальном наполнении может измениться, и жёстко
        заданное значение разошлось бы с таблицей при следующем сиде.
      runOnChange: false
      changes:
        - sql:
            sql: SELECT setval('items_id_seq', COALESCE((SELECT MAX(id) FROM items), 1))
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 2
      author: student
      dbms: h2
      comment: >
        Перезапускает счётчик идентификаторов items за максимальным
        идентификатором. Обратное слово соответствует H2.
      runOnChange: false
      changes:
        - sql:
            sql: ALTER TABLE items ALTER COLUMN id RESTART WITH (SELECT COALESCE(MAX(id), 1) FROM items)
            splitStatements: true
            stripComments: true