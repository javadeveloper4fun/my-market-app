# ===================================================================
# Таблица витрины товаров.
#
# img_path идёт подчёркиванием из поля imgPath (стратегия именования
# Hibernate). price — NUMERIC(10,2), а не FLOAT: деньги нельзя хранить
# в двоичном формате, иначе накопятся погрешности округления.
#
# Типы диалектно-нейтральны: одинаково валидны для PostgreSQL и для H2
# в режиме MODE=PostgreSQL, который используется в тестах.
# ===================================================================

databaseChangeLog:

  - changeSet:
      id: "1"
      author: "student"
      comment: "Таблица товаров витрины"
      # Режим по умолчанию — HALT: если таблица уже существует, changeset
      # не выполняется, а Liquibase прерывает запуск с ошибкой.
      # Альтернатива — onFail: MARK_RAN, которая отметила бы изменение
      # выполненным, хотя оно не выполнялось: база прошла бы миграции,
      # не будучи ими создана, и расхождение со схемой осталось бы
      # незамеченным. HALT останавливает запуск и требует разобраться
      # с причиной до продолжения работы.
      onFailMessage: "Таблица items уже существует: база создана в обход Liquibase"
      preConditions:
        - not:
            - tableExists:
                tableName: items
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_items
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: img_path
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
      rollback:
        # Откат удаляет таблицу вместе с данными. Spring Boot при старте
        # откат не выполняет — он только применяет миграции, — поэтому
        # этот блок используется вручную, через Liquibase CLI.
        - dropTable:
            tableName: items
