# ===================================================================
# Таблица заказов.
#
# В таблице только идентификатор. Колонки order_id здесь нет: связь
# заказ → позиции объявлена в сущности Order через mappedBy, поэтому
# колонка создаётся на стороне order_item (см. 004-init-order-item.yaml).
# ===================================================================

databaseChangeLog:

  - changeSet:
      id: "2"
      author: "student"
      comment: "Таблица заказов"
      onFailMessage: "Таблица orders уже существует: база создана в обход Liquibase"
      preConditions:
        - not:
            - tableExists:
                tableName: orders
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
                    nullable: false
      rollback:
        - dropTable:
            tableName: orders
