spring:
  application:
    name: my-market-app

  # Спринт 6 — реактивный доступ к данным.
  # Приложение ходит в БД через R2DBC, у него свой адрес и свой набор
  # переменных окружения. Он отличается от JDBC-адреса префиксом r2dbc:postgresql
  # и без параметра jdbc:.
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5439/market}
    username: ${SPRING_R2DBC_USERNAME:market}
    password: ${SPRING_R2DBC_PASSWORD:market}

  # DataSource нужен только Liquibase: миграции выполняются через JDBC
  # до старта приложения, до появления ConnectionFactory. Само приложение
  # этот пул не использует.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/market}
    username: ${SPRING_DATASOURCE_USERNAME:market}
    password: ${SPRING_DATASOURCE_PASSWORD:market}

  liquibase:
    # Спринт 5, Тема 4, Урок 1 — миграции схемы БД.
    # Схему создаёт Liquibase из файла миграций, а не Hibernate.
    # Каждый changeset применяется один раз; применённые отмечаются
    # в служебной таблице DATABASECHANGELOG и при следующем старте
    # пропускаются. Запуск приложения = применение недостающих миграций.
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Спринт 5, Тема 4, Урок 2 — целевая схема для всех changeset'ов.
    # Без этой настройки Liquibase берёт имя схемы из метаданных подключения,
    # то есть из схемы пользователя по умолчанию. Указание явно делает целевую
    # схему частью конфигурации, а не побочным эффектом учётных данных.
    # Тестовый профиль не переопределяет параметр, поэтому настройка
    # действует и на H2: в режиме MODE=PostgreSQL схема называется PUBLIC.
    default-schema: public

server:
  port: 8080
