spring:
  application:
    name: my-market-app

  datasource:
    # Персистентная БД — PostgreSQL, поднимается командой
    # docker compose up -d (см. docker-compose.yml).
    url: jdbc:postgresql://localhost:5439/market
    username: market
    password: market

  jpa:
    # Отключаем привязку EntityManager к запросу (OSIV), чтобы сессия
    # не удерживалась до конца HTTP-запроса.
    open-in-view: false
    properties:
      hibernate:
        # В Spring Boot 4 свойство spring.jpa.hibernate.ddl-auto удалено,
        # поэтому режим генерации схемы задаётся Hibernate напрямую.
        # create пересоздаёт схему по сущностям при каждом старте
        # (учебный проект: накопления данных в БД не требуется).
        hbm2ddl:
          auto: create
    # data.sql выполняется после того, как Hibernate создаст таблицы.
    defer-datasource-initialization: true

  sql:
    init:
      # Накатывать data.sql (стартовое наполнение витрины) всегда.
      mode: always

server:
  port: 8080