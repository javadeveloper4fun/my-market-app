spring:
  application:
    name: my-market-app

  datasource:
    # Спринт 5, Тема 2, Урок 1 — DataSource (фабрика подключений).
    # Общие параметры любой реализации DataSource. По умолчанию — Hikari (пул, 10 соединений).
    # Персистентная БД — PostgreSQL (см. docker-compose.yml).
    # Значения переопределяются переменными окружения при запуске
    # в Docker: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
    # SPRING_DATASOURCE_PASSWORD. По умолчанию — локальный PostgreSQL,
    # доступный по адресу localhost:5439.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/market}
    username: ${SPRING_DATASOURCE_USERNAME:market}
    password: ${SPRING_DATASOURCE_PASSWORD:market}

  jpa:
    # Отключаем привязку EntityManager к запросу (OSIV), чтобы сессия
    # не удерживалась до конца HTTP-запроса.
    open-in-view: false
    properties:
      hibernate:
        # В Spring Boot 4 свойство spring.jpa.hibernate.ddl-auto удалено,
        # поэтому режим генерации схемы задаётся Hibernate напрямую.
        # create — полностью пересоздаёт схему по сущностям при каждом старте.
        # Цена: все данные теряются. Только для учебного проекта;
        # в проде нужны Flyway/Liquibase (Спринт 5, Тема 4) и hbm2ddl=none.
        hbm2ddl:
          auto: create
    # data.sql выполняется после того, как Hibernate создаст таблицы.
    defer-datasource-initialization: true

  sql:
    init:
      # Накатывать data.sql (стартовое наполнение витрины) всегда.
      mode: always

server:
  port: 8080