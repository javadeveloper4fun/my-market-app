spring:
  application:
    name: my-market-app

  datasource:
    # Тестовый профиль: встроенная H2 в режиме совместимости
    # с PostgreSQL, поэтому для запуска тестов Docker не нужен.
    url: jdbc:h2:mem:market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""

  jpa:
    properties:
      hibernate:
        # Контекст теста стартует на пустой схеме каждого прогона
        # (Hibernate создаёт её по сущностям, см. spring.jpa.properties).
        hbm2ddl:
          auto: create-drop
    # data.sql накатывается уже после создания схемы Hibernate.
    defer-datasource-initialization: true

  sql:
    init:
      # Стартовое наполнение data.sql применяется и в тестах (@DataJpaTest).
      mode: always