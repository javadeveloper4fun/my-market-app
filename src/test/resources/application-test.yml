spring:
  application:
    name: my-market-app

  datasource:
    # Тестовый профиль: встроенная H2 в режиме совместимости
    # с PostgreSQL, поэтому для запуска тестов Docker не нужен.
    url: jdbc:h2:mem:market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""

  jpa:
    hibernate:
      # Контекст теста стартует на пустой схеме каждого прогона.
      ddl-auto: create-drop
    defer-datasource-initialization: true

  sql:
    init:
      # Наполнение data.sql применяется и в тестах (@DataJpaTest).
      mode: always