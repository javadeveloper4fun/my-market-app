spring:
  application:
    name: my-market-app

  datasource:
    # Спринт 5, Тема 2, Урок 1 — тестовый профиль: H2 вместо PostgreSQL (MODE=PostgreSQL).
    # Альтернатива для проверки поведения, близкого к проду, — Testcontainers с настоящей СУБД.
    url: jdbc:h2:mem:market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""

  jpa:
    properties:
      hibernate:
        # Контекст теста стартует на пустой схеме каждого прогона
        # (Hibernate создаёт её по сущностям, см. spring.jpa.properties).
        hbm2ddl:
          auto: create-drop
    # data.sql накатывается уже после создания схемы Hibernate.
    defer-datasource-initialization: true

  sql:
    init:
      # data.sql не накатывается в тестовом профиле: @DataJpaTest и
      # @SpringBootTest-тесты сами наполняют схему изолированными данными.
      mode: never