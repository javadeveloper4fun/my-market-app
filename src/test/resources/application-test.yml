spring:
  application:
    name: my-market-app

  # Тесты ходят в базу через R2DBC — так же, как приложение. Параметры JDBC
  # ниже нужны только Liquibase, и обе схемы должны вести в одну и ту же
  # базу в памяти.
  #
  # Различие в написании адресов — не опечатка, а следствие разбора URL
  # драйвером: в «r2dbc:h2:mem:///market;...» разделитель «;» не работает
  # как разделитель опций, и настройки попадают в имя базы. Драйвер
  # подставляет префикс «jdbc:h2:», поэтому у JDBC такой же итоговый вид.
  # С «mem:///market» миграции применялись бы к одной базе, а запросы шли
  # бы в другую.
  #
  # CASE_INSENSITIVE_IDENTIFIERS убирает расхождения регистра имён, которых
  # в самом приложении нет: Liquibase складывает имена без кавычек по
  # правилам СУБД, а Spring Data заключает их в кавычки. На PostgreSQL
  # обе стороны дают нижний регистр, на H2 без этого параметра запрос
  # падал то на таблице, то на столбце.
  r2dbc:
    url: r2dbc:h2:mem:///market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""

  datasource:
    # Спринт 5, Тема 2, Урок 1 — тестовый профиль: H2 вместо PostgreSQL (MODE=PostgreSQL).
    # Альтернатива для проверки поведения, близкого к проду, — Testcontainers с настоящей СУБД.
    url: jdbc:h2:mem:market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""

  liquibase:
    # Тесты применяют тот же changelog, что и основной профиль: схема
    # проверяется на переносимость между PostgreSQL и H2.
    # context: test исключает changeset'ы с другими контекстами, в частности
    # стартовое наполнение витрины (context: seed). Изменения без context
    # применяются в любом случае. Тесты наполняют базу своими данными.
    contexts: test