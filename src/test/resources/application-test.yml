spring:
  application:
    name: my-market-app

  # Тесты ходят в базу через R2DBC — так же, как приложение. Параметры JDBC
  # ниже нужны только Liquibase, и обе схемы должны вести в одну и ту же базу в
  # памяти.
  #
  # Различие в написании адресов — не опечатка, а следствие разбора URL драйвером.
  # Строка «r2dbc:h2:mem:///market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL» разбирается
  # в «protocol=mem, database=market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL»: имя базы
  # захватывает и настройки, потому что разделитель «;» здесь не работает как
  # разделитель опций. Драйвер подставляет к результату префикс «jdbc:h2:», и H2
  # получает «jdbc:h2:mem:market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL» — то есть
  # базу с именем market и включённым MODE=PostgreSQL.
  #
  # Поэтому у JDBC такой же итоговый вид, а не «mem:///market». С «mem:///market»
  # миграции применялись бы к одной базе в памяти, а запросы шли бы в другую, и
  # первая же вставка падала бы с «table not found».
  #
  # CASE_INSENSITIVE_IDENTIFIERS убирает расхождения регистра имён, которых нет
  # в самом приложении. Liquibase создаёт таблицы, складывая имена без кавычек
  # по правилам СУБД, а Spring Data для R2DBC строит запросы, заключая имена в
  # кавычки. На PostgreSQL обе стороны дают нижний регистр, и расхождения не
  # возникает; на H2 без этого параметра одна сторона писала «items»/«title», а
  # другая «ITEMS»/«TITLE», и запрос падал то на таблице, то на столбце.
  # Проверять регистр имён в тестах репозитория смысла нет — это свойство
  # тестовой СУБД, а не логики приложения.
  r2dbc:
    url: r2dbc:h2:mem:///market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""

  datasource:
    # Спринт 5, Тема 2, Урок 1 — тестовый профиль: H2 вместо PostgreSQL (MODE=PostgreSQL).
    # Альтернатива для проверки поведения, близкого к проду, — Testcontainers с настоящей СУБД.
    url: jdbc:h2:mem:market;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""

  liquibase:
    # Тесты применяют тот же changelog, что и основной профиль: схема
    # проверяется на переносимость между PostgreSQL и H2.
    # context: test исключает changeset'ы с другими контекстами, в частности
    # стартовое наполнение витрины (context: seed). Изменения без context
    # применяются в любом случае. Тесты наполняют базу своими данными.
    contexts: test