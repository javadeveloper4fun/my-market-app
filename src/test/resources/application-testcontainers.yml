spring:
  application:
    name: my-market-app

  # Параметры подключения намеренно не заданы: их берёт контейнер.
  # @ServiceConnection публикует сведения только о JDBC-подключении — их
  # достаточно Liquibase. Фабрику R2DBC приложение получает из отдельного
  # бина testConnectionFactory того же класса конфигурации; почему так,
  # описано там же. Значения из application.yml не мешают: сведения из
  # контейнера имеют приоритет, а эти свойства здесь и не заданы.
  #
  # От профиля test этот профиль отличается только источником БД, поэтому
  # настройки Liquibase совпадают: различие поведения объясняется самой СУБД.

  liquibase:
    # Тот же changelog, что и в остальных окружениях — это и есть причина
    # запускать проверки на настоящей PostgreSQL.
    # context: test исключает changeset'ы с другими контекстами, поэтому
    # стартовое наполнение витрины (context: seed) не выполняется
    # и каждый тест начинает с пустого каталога.
    contexts: test