spring:
  application:
    name: my-market-app

  # Параметры подключения намеренно не задаются: их берёт контейнер.
  # @ServiceConnection публикует только сведения о подключении через JDBC —
  # они нужны Liquibase. Фабрику соединений R2DBC приложение получает из
  # отдельного бина testConnectionFactory того же конфигурационного класса,
  # собранного из данных контейнера вручную; почему так, описано там же.
  # Значения из application.yml (localhost:5439) не мешают: зарегистрированные
  # сведения о подключении имеют приоритет над свойствами spring.datasource,
  # а последние здесь и не заданы.
  #
  # Профиль testcontainers вместо test отличается только источником БД:
  # настройки Liquibase ниже совпадают с тестовым профилем, чтобы различие
  # поведения объяснялось самой СУБД, а не конфигурацией.

  liquibase:
    # Тот же changelog, что и в остальных окружениях: это и есть главная
    # причина запускать проверки на настоящей PostgreSQL — миграции
    # применяются тем же кодом, что и в docker-compose.
    # context: test исключает changeset'ы с другими контекстами, поэтому
    # стартовое наполнение витрины (context: seed) не выполняется
    # и каждый тест начинает с пустого каталога.
    contexts: test